name: Daily Arxiv Bot

# Trigger update
on:
  schedule:
    # 每天 UTC 时间 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点按钮触发

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r daily_paper_bot/requirements.txt

      - name: Run Arxiv Bot (Scrape & Summarize)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: "deepseek-reasoner"
        run: |
          # 确保历史记录文件存在，防止首次运行报错
          touch daily_paper_bot/processed_ids.txt
          python daily_paper_bot/main.py

      - name: Run Merge Script (Generate Website)
        run: |
          python daily_paper_bot/merge_reports.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 调试：查看当前文件状态
          echo "=== Git Status Before Add ==="
          git status
          ls -l daily_paper_bot/
          
          # 强制添加，如果文件被 gitignore 忽略则强制包含 (-f)
          git add -f daily_paper_bot/processed_ids.txt || true
          
          git add reports/ || true
          git add pdfs/ || true
          git add public/ || true
          git add index.html || true
          
          echo "=== Git Status After Add ==="
          git status
          
          # 没有变化时跳过提交和推送
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update: New papers and website build"
          
          # 先拉取远程最新代码，避免冲突
          git pull --rebase origin main
          
          # 推送
          git push origin HEAD:main



