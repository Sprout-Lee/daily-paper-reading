name: Daily Arxiv Bot

# Trigger update
on:
  schedule:
    # 每天 UTC 时间 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点按钮触发

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r daily_paper_bot/requirements.txt

      - name: Run Arxiv Bot (Scrape & Summarize)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: "deepseek-chat"
        run: |
          # 确保历史记录文件存在，防止首次运行报错
          touch daily_paper_bot/processed_ids.txt
          python daily_paper_bot/main.py

      - name: Run Merge Script (Generate Website)
        run: |
          python daily_paper_bot/merge_reports.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制添加所有变动的文件（忽略不存在的文件报错）
          git add reports/ || true
          git add pdfs/ || true
          git add daily_paper_bot/*.txt || true
          git add index.html || true
          
          # 提交（如果没东西提交就跳过）
          git commit -m "🤖 Auto update: New papers & Website build" || echo "No changes to commit"
          
          # 推送
          git push origin HEAD:main


